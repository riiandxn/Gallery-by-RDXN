name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download face recognition model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 -o app/src/main/assets/sface.onnx \
            https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx
          ls -la app/src/main/assets
          test "$(stat -c%s app/src/main/assets/sface.onnx)" -gt 1000000

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: RDXN-Gallery-APK
          path: app/build/outputs/apk/debug/*.apk
